<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One map, five passes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EDF0F5; --panel:#FFFFFF; --ink:#13294B; --soft:#55678A; --rule:#D3DAE6;
  --accent:#D9541A; --accent-ink:#FFFFFF; --chip:#E3E8F1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0A1222; --panel:#111C33; --ink:#E8EDF5; --soft:#9DADC9; --rule:#24355A;
    --accent:#FF7F32; --accent-ink:#101E3A; --chip:#1A2947;
  }
}
:root[data-theme="dark"]{
  --page:#0A1222; --panel:#111C33; --ink:#E8EDF5; --soft:#9DADC9; --rule:#24355A;
  --accent:#FF7F32; --accent-ink:#101E3A; --chip:#1A2947;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1360px; margin:0 auto; padding:20px 24px 28px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px}
h1{font-size:1.375rem; font-weight:800; letter-spacing:-0.01em; margin:0}
header p{margin:0; color:var(--soft); font-size:.9375rem}

.stage{display:grid; grid-template-columns:minmax(0,1.62fr) minmax(280px,1fr); gap:20px; align-items:start}
.chart{background:#101E3A; border-radius:6px; overflow:hidden; position:relative; aspect-ratio:1064/850}
.chart svg,.chart img{display:block; width:100%; height:100%}
.chart .layer{position:absolute; inset:0; transition:opacity .35s ease}
.chart .layer.hidden{opacity:0; pointer-events:none}
@media (prefers-reduced-motion: reduce){.chart .layer{transition:none}}

.notes{background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:22px 24px 20px; min-height:100%}
.count{font-size:.875rem; color:var(--soft); font-weight:600; margin:0 0 2px}
.notes h2{font-size:1.75rem; line-height:1.15; font-weight:800; letter-spacing:-0.015em; margin:0 0 16px}
.notes h3{font-size:.875rem; font-weight:600; color:var(--soft); margin:16px 0 4px}
.notes p{margin:0; font-size:1.0625rem; max-width:46ch}
.notes ul{margin:0; padding-left:1.1em; font-size:1.0625rem; max-width:46ch}
.notes li{margin:2px 0}
.principle{margin-top:18px !important; padding:12px 14px; border-left:4px solid var(--accent); background:var(--chip); font-weight:500; border-radius:0 4px 4px 0}

.rail{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin-top:16px}
.rail button{
  font:inherit; text-align:left; cursor:pointer; color:var(--ink);
  background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:10px 12px;
  display:flex; flex-direction:column; gap:2px; min-height:64px;
}
.rail button span{font-size:.8125rem; color:var(--soft); font-weight:600}
.rail button strong{font-size:.9375rem; font-weight:600; line-height:1.25}
.rail button[aria-current="step"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rail button[aria-current="step"] span{color:var(--accent-ink); opacity:.85}
.rail button:focus-visible,.tools button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.tools{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap}
.tools button{
  font:inherit; font-weight:600; font-size:.9375rem; cursor:pointer; color:var(--ink);
  background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:8px 14px;
}
.tools button:disabled{opacity:.4; cursor:default}
.tools .hint{color:var(--soft); font-size:.875rem; margin-left:auto}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tools .hint{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>One map, five passes</h1>
    <p>Chicago e-scooter pilot, 2019. The data are identical in every frame, and only the design changes.</p>
  </header>

  <div class="stage">
    <div class="chart" id="chart" aria-live="polite"></div>
    <aside class="notes" id="notes"></aside>
  </div>

  <div class="tools">
    <button id="prev">Back</button>
    <button id="next">Next pass</button>
    <button id="compare" aria-pressed="false">Hold to see the starting plot</button>
    <span class="hint">Arrow keys move between passes</span>
  </div>

  <nav class="rail" id="rail" aria-label="Passes"></nav>
</div>

/* ---------- chart drawing ---------- */
function mapLayer(step, fit){
  const {s, ox, oy} = fit;
  const tf = `translate(${ox},${oy}) scale(${s})`;
  let g = `<g transform="${tf}">`;
  if (step >= 2){
    for (const a of GEO.areas) if (!a.on)
      g += `<path d="${a.d}" fill="none" stroke="${C.ctx}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  for (const a of GEO.areas) if (a.on && !a.top)
    g += `<path d="${a.d}" fill="${C.other}" stroke="${C.bg}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
  for (const a of GEO.areas) if (a.top)
    g += `<path d="${a.d}" fill="${C.top}" stroke="${C.bg}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  if (step >= 2){
    const loop = GEO.areas.find(a => a.n === "Loop");
    g += `<path d="${loop.d}" fill="none" stroke="${C.text}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
  }
  g += `</g>`;
  return g;
}
const px = (fit, x, y) => [fit.ox + x*fit.s, fit.oy + y*fit.s];

function labels(step, fit){
  let t = "";
  const wt = GEO.areas.find(a => a.n === "West Town");
  const nw = GEO.areas.find(a => a.n === "Near West Side");
  const loop = GEO.areas.find(a => a.n === "Loop");
  const [wx, wy] = px(fit, wt.c[0]+4, wt.c[1]+6);
  const [nx, ny] = px(fit, nw.c[0], nw.c[1]);
  if (step < 3){
    t += `<text ${FONT} font-weight="700" font-size="21" fill="${C.navy}" text-anchor="middle">
            <tspan x="${wx}" y="${wy-4}">West Town</tspan><tspan x="${wx}" dy="25">30%</tspan></text>`;
    t += `<text ${FONT} font-weight="700" font-size="21" fill="${C.navy}" text-anchor="middle">
            <tspan x="${nx}" y="${ny-22}">Near West</tspan><tspan x="${nx}" dy="25">Side</tspan><tspan x="${nx}" dy="25">32%</tspan></text>`;
  } else {
    t += `<text ${FONT} fill="${C.navy}" text-anchor="middle">
            <tspan x="${wx}" y="${wy+8}" font-size="40" font-weight="800">30%</tspan>
            <tspan x="${wx}" dy="22" font-size="16" font-weight="600">West Town</tspan></text>`;
    t += `<text ${FONT} fill="${C.navy}" text-anchor="middle">
            <tspan x="${nx}" y="${ny+6}" font-size="40" font-weight="800">32%</tspan>
            <tspan x="${nx}" dy="22" font-size="16" font-weight="600">Near West Side</tspan></text>`;
    // combined label for the rest, anchored in the empty southwest corner with a leader
    const [ax, ay] = px(fit, 300, 440);      // point inside Austin
    const [lx, ly] = px(fit, 60, 730);
    t += `<line x1="${lx+70}" y1="${ly-30}" x2="${ax}" y2="${ay}" stroke="${C.muted}" stroke-width="1"/>
          <circle cx="${ax}" cy="${ay}" r="3" fill="${C.muted}"/>
          <text ${FONT} fill="${C.text}" x="${lx}" y="${ly}">
            <tspan font-size="26" font-weight="800">38%</tspan>
            <tspan x="${lx}" dy="21" font-size="16" fill="${C.muted}">across the other 17 areas</tspan></text>`;
  }
  // Loop
  if (step < 2){
    const [lx, ly] = px(fit, loop.c[0]+62, loop.c[1]+6);
    t += `<text ${FONT} font-size="21" fill="${C.text}" x="${lx}" y="${ly}">Loop</text>`;
  } else {
    const [lx, ly] = px(fit, loop.b[2]-40, loop.c[1]+30);
    t += `<text ${FONT} fill="${C.text}" x="${lx}" y="${ly}" font-size="17" font-weight="600">Loop
            <tspan x="${lx}" dy="18" font-size="14" font-weight="400" fill="${C.muted}">downtown</tspan></text>`;
    const [kx, ky] = px(fit, 1090, 230);
    t += `<text ${FONT} font-style="italic" font-size="15" fill="#6F83A8" x="${kx}" y="${ky}" text-anchor="middle">Lake
            <tspan x="${kx}" dy="18">Michigan</tspan></text>`;
  }
  return t;
}

function words(step){
  let t = "";
  if (step < 4){
    t += `<text ${FONT} font-weight="700" font-size="38" fill="${C.text}" x="32" y="76">Near West Side and West Town drew 62% of all
            <tspan x="32" dy="50">scooter trips</tspan></text>
          <text ${FONT} font-size="26" fill="${C.muted}" x="32" y="164">Share of 2019 pilot trips by starting community area. 19 areas recorded trips.</text>
          <text ${FONT} font-size="17.5" fill="${C.muted}" x="32" y="820">Source: City of Chicago Data Portal, E-Scooter Trips 2019 Pilot. Basemap © OpenStreetMap contributors © CARTO</text>`;
  } else {
    t += `<text ${FONT} font-weight="800" font-size="38" fill="${C.text}" x="32" y="70" letter-spacing="-0.4">Two neighborhoods beside downtown drew
            <tspan x="32" dy="46">62% of scooter trips</tspan></text>
          <text ${FONT} font-size="20" fill="${C.muted}" x="32" y="150">Chicago e-scooter pilot, June to October 2019. Share of trips by the area where the ride began.</text>`;
    if (step === 4){
      t += `<rect x="32" y="170" width="16" height="16" rx="2" fill="${C.top}"/>
            <text ${FONT} font-size="18" fill="${C.text}" x="56" y="184">Near West Side and West Town</text>
            <rect x="330" y="170" width="16" height="16" rx="2" fill="${C.other}"/>
            <text ${FONT} font-size="18" fill="${C.text}" x="354" y="184">17 other community areas with trips</text>`;
    } else {
      const x0 = 32, W = 1000, y = 170, h = 38, gap = 3;
      const a = W*0.32, b = W*0.30, c = W*0.38;
      t += `<rect x="${x0}" y="${y}" width="${a-gap}" height="${h}" fill="${C.top}"/>
            <rect x="${x0+a}" y="${y}" width="${b-gap}" height="${h}" fill="${C.top}"/>
            <rect x="${x0+a+b}" y="${y}" width="${c}" height="${h}" fill="${C.other}"/>
            <text ${FONT} font-size="17" font-weight="700" fill="${C.navy}" x="${x0+12}" y="${y+25}">Near West Side 32%</text>
            <text ${FONT} font-size="17" font-weight="700" fill="${C.navy}" x="${x0+a+12}" y="${y+25}">West Town 30%</text>
            <text ${FONT} font-size="17" font-weight="600" fill="${C.text}" x="${x0+a+b+12}" y="${y+25}">17 other areas 38%</text>`;
    }
    t += `<text ${FONT} font-size="15.5" fill="${C.muted}" x="32" y="822">Source: City of Chicago Data Portal, E-Scooter Trips 2019 Pilot. Areas with 50 or fewer trips are not shown.</text>`;
  }
  return t;
}

function legend(){
  // echo of the ggplot gradient legend position, shown only so its removal is visible in pass 1. Not drawn after pass 0.
  return "";
}

function fitFor(step){
  if (step === 1) return { s:0.645, ox:70,  oy:218 };          // same place as the starting plot
  if (step <= 4)  return { s:0.675, ox:165, oy:222 };          // grows into the legend's space
  return { s:0.64, ox:185, oy:246 };                          // room for the bar
}

function drawChart(step){
  if (step === 0) return `<img src="${START_IMG}" alt="Starting plot from R with a gradient legend, a floating Loop label, and unused space on the right">`;
  const fit = fitFor(step);
  return `<svg viewBox="0 0 1064 850" role="img" aria-label="${STEPS[step].title}">
    <rect width="1064" height="850" fill="${C.bg}"/>
    <clipPath id="clip${step}"><rect x="0" y="${step>=5?226:200}" width="1064" height="${step>=5?574:600}"/></clipPath>
    <g clip-path="url(#clip${step})">${mapLayer(step, fit)}</g>
    ${labels(step, fit)}
    ${words(step)}
  </svg>`;
}

/* ---------- page wiring ---------- */
let current = 0, comparing = false;
const chart = document.getElementById("chart");
const notes = document.getElementById("notes");
const rail  = document.getElementById("rail");
const prev  = document.getElementById("prev");
const next  = document.getElementById("next");
const cmp   = document.getElementById("compare");

STEPS.forEach((s, i) => {
  const layer = document.createElement("div");
  layer.className = "layer hidden"; layer.innerHTML = drawChart(i);
  chart.appendChild(layer);
  const b = document.createElement("button");
  b.innerHTML = `<span>${i === 0 ? "Start" : "Pass " + i}</span><strong>${s.name}</strong>`;
  b.addEventListener("click", () => go(i));
  rail.appendChild(b);
});

function show(idx){
  [...chart.children].forEach((l, i) => l.classList.toggle("hidden", i !== idx));
}
function go(i){
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[current];
  show(current);
  let h = `<p class="count">${current === 0 ? "Start" : "Pass " + current + " of " + (STEPS.length - 1)}</p><h2>${s.title}</h2>`;
  if (s.list) h += `<h3>${s.listHead}</h3><ul>${s.list.map(x => `<li>${x}</li>`).join("")}</ul>`;
  if (s.changed) h += `<h3>What changed</h3><p>${s.changed}</p>`;
  if (s.why) h += `<h3>Why it works</h3><p>${s.why}</p>`;
  h += `<h3>Ask the class</h3><p>${s.ask}</p>`;
  h += `<p class="principle">${s.principle}</p>`;
  notes.innerHTML = h;
  [...rail.children].forEach((b, i) => i === current ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"));
  prev.disabled = current === 0;
  next.disabled = current === STEPS.length - 1;
  cmp.disabled = current === 0;
}
prev.addEventListener("click", () => go(current - 1));
next.addEventListener("click", () => go(current + 1));
const startCompare = () => { if (current > 0) { show(0); cmp.setAttribute("aria-pressed", "true"); } };
const endCompare   = () => { show(current); cmp.setAttribute("aria-pressed", "false"); };
["mousedown","touchstart"].forEach(e => cmp.addEventListener(e, startCompare, {passive:true}));
["mouseup","mouseleave","touchend","touchcancel","blur"].forEach(e => cmp.addEventListener(e, endCompare));
cmp.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") startCompare(); });
cmp.addEventListener("keyup", endCompare);
document.addEventListener("keydown", e => {
  if (e.target === cmp) return;
  if (e.key === "ArrowRight") go(current + 1);
  if (e.key === "ArrowLeft")  go(current - 1);
});
go(0);
</script>
